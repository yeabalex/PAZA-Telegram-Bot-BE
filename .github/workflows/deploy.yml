name: CI/CD Pipeline - Build, Publish & Deploy

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1. CI Stage: Code Syntax & Verification
  ci:
    name: CI - Code Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Syntax
        run: |
          python -m compileall app/ run_bot.py

  # 2. Build & Push Docker Image to GitHub Container Registry (GHCR)
  build-and-push:
    name: Build & Push Docker Image
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # 3. CD Stage: Deploy to EC2 Server via SSH
  deploy:
    name: Deploy to EC2 Server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            # Define app directory
            APP_DIR="/home/${{ secrets.SSH_USER }}/app"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # Log in to GHCR on the EC2 server using GITHUB_TOKEN
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Generate .env file on server with strict 600 permissions
            cat <<'EOF' > .env
            PROJECT_NAME="${{ secrets.PROJECT_NAME }}"
            API_V1_STR="${{ secrets.API_V1_STR }}"
            ENVIRONMENT="${{ secrets.ENVIRONMENT }}"
            DEBUG="${{ secrets.DEBUG }}"
            PORT="${{ secrets.PORT }}"
            HOST="${{ secrets.HOST }}"

            POSTGRES_SERVER="${{ secrets.POSTGRES_SERVER }}"
            POSTGRES_PORT="${{ secrets.POSTGRES_PORT }}"
            POSTGRES_USER="${{ secrets.POSTGRES_USER }}"
            POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
            POSTGRES_DB="${{ secrets.POSTGRES_DB }}"
            DATABASE_URL="${{ secrets.DATABASE_URL }}"

            REDIS_HOST="${{ secrets.REDIS_HOST }}"
            REDIS_PORT="${{ secrets.REDIS_PORT }}"
            REDIS_URL="${{ secrets.REDIS_URL }}"

            GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
            DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}"
            GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}"

            JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}"
            JWT_ALGORITHM="${{ secrets.JWT_ALGORITHM || 'HS256' }}"
            JWT_ACCESS_TOKEN_EXPIRE_DAYS="${{ secrets.JWT_ACCESS_TOKEN_EXPIRE_DAYS || '30' }}"
            GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"

            TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
            MINI_APP_URL="${{ secrets.MINI_APP_URL }}"
            ADMIN_TELEGRAM_CHAT_ID="${{ secrets.ADMIN_TELEGRAM_CHAT_ID }}"

            INSTAGRAM_SESSION_ID="${{ secrets.INSTAGRAM_SESSION_ID }}"
            TIKTOK_SESSION_ID="${{ secrets.TIKTOK_SESSION_ID }}"

            CLOUDINARY_CLOUD_NAME="${{ secrets.CLOUDINARY_CLOUD_NAME }}"
            CLOUDINARY_API_KEY="${{ secrets.CLOUDINARY_API_KEY }}"
            CLOUDINARY_API_SECRET="${{ secrets.CLOUDINARY_API_SECRET }}"
            CLOUDINARY_URL="${{ secrets.CLOUDINARY_URL }}"

            R2_ACCOUNT_ID="${{ secrets.R2_ACCOUNT_ID }}"
            R2_ACCESS_KEY_ID="${{ secrets.R2_ACCESS_KEY_ID }}"
            R2_SECRET_ACCESS_KEY="${{ secrets.R2_SECRET_ACCESS_KEY }}"
            R2_BUCKET_NAME="${{ secrets.R2_BUCKET_NAME }}"
            R2_PUBLIC_URL="${{ secrets.R2_PUBLIC_URL }}"
            EOF

            chmod 600 .env

            # Write docker-compose.yml on server pointing to GHCR image
            IMAGE_REPO=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
            IMAGE_TAG="${IMAGE_REPO}:latest"

            cat <<EOF > docker-compose.yml
            services:
              api:
                image: ${IMAGE_TAG}
                container_name: paza_event_api
                restart: always
                env_file:
                  - .env
                ports:
                  - "8000:8000"
                volumes:
                  - static_data:/app/static

              bot:
                image: ${IMAGE_TAG}
                container_name: paza_event_bot
                restart: always
                command: ["python", "run_bot.py"]
                env_file:
                  - .env

            volumes:
              static_data:
            EOF

            # Pull latest image & restart services
            docker compose pull
            docker compose up -d --remove-orphans

            # Prune old unused Docker images to keep disk clean
            docker image prune -af

